# Despliegue de la API en Render.
# Se importa desde el panel: New → Blueprint → conectar este repositorio.
#
# La base de datos NO se declara aquí a propósito. La Postgres gratuita de
# Render solo permite una por workspace y CADUCA 30 DÍAS después de
# crearse, con 14 de gracia antes de borrarla. Una temporada dura meses:
# la base moriría a mitad del torneo con los rosters y la documentación
# validada dentro. Por eso la base vive en Neon y aquí solo se consume su
# cadena de conexión.
services:
  - type: web
    name: mfl-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev es obligatorio: NODE_ENV=production (más abajo) hace que
    # npm ci omita las devDependencies, y TypeScript vive ahí. Sin esta
    # bandera el build no encuentra tsc y compila con lo que haya en la
    # imagen de Render, que no es lo que se probó.
    buildCommand: npm ci --include=dev && npm run build
    # Las migraciones corren SOLAS antes de arrancar.
    #
    # Antes eran un paso manual, y eso falló como tenía que fallar: se
    # desplegó un cambio de esquema sin correrlas y la pantalla de equipos
    # empezó a responder "Error interno del servidor". El aviso llegó por
    # WhatsApp, no por el log.
    #
    # `migrations.sql` es idempotente de punta a punta (IF NOT EXISTS en
    # tablas, columnas e índices), así que correrlo en cada arranque es
    # seguro. Y si fallara, la API no arranca: el problema sale en el log
    # del despliegue, que es donde se puede ver.
    startCommand: npm run migrate:prod && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # ── Base de datos (Neon) ──
      # Pegar la cadena CON POOLER de Neon. sync:false = se captura a mano
      # en el panel y no se guarda en el repositorio.
      - key: DATABASE_URL
        sync: false

      # ── Sesiones ──
      # Render lo genera: un secreto escrito a mano acaba siendo débil.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 8h
      - key: JWT_REFRESH_EXPIRATION
        value: 7d

      # ── CORS ──
      # La URL de Vercel. Si no coincide exactamente, el navegador bloquea
      # todas las llamadas y el login parece muerto sin explicar por qué.
      - key: FRONTEND_URL
        sync: false

      # ── Almacenamiento de documentos (Cloudinary) ──
      # Obligatorio en producción: el disco del plan gratuito de Render es
      # efímero y se borra en cada despliegue. Sin esto, las
      # identificaciones de los jugadores desaparecen al siguiente deploy.
      - key: CLOUDINARY_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── Correo (Resend) ──
      # Opcional. Sin esto las notificaciones se registran en consola en
      # lugar de enviarse, y nada falla.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
